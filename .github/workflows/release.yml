name: Release

# Fires on version tags (v1.2.3). Push a tag to build, sign, notarize, and
# publish a DMG to a GitHub Release:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # to create the Release and upload the DMG asset

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run checks
        run: swift test

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

      - name: Store notarization credentials
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > notary_key.p8
          ./Scripts/notarize.sh --store-credentials notary_key.p8 "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"
          rm -f notary_key.p8

      - name: Build, sign, and notarize Aurora.app
        run: ./Scripts/package_app.sh release notarize

      - name: Create DMG
        run: |
          STAGING=dist/dmg-staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R dist/Aurora.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Aurora" -srcfolder "$STAGING" -ov -format UDZO "dist/Aurora-${{ github.ref_name }}.dmg"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Aurora-${{ github.ref_name }}.dmg
